server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-login
              uri: http://localhost:8100
              predicates:
                - Path=/auth/login
                - Method=POST
            - id: account-get
              uri: http://localhost:8100
              predicates:
                - Path=/v1/accounts/{id}
                - Method=GET
            - id: account-me
              uri: http://localhost:8100
              predicates:
                - Path=/auth/me
                - Method=GET
            - id: transaction-debit
              uri: http://localhost:8101
              predicates:
                - Path=/v1/transactions/debit
                - Method=POST
bank:
  jwt:
    public-key: 'D:\Demos spring boot\bank-keys\public.pem'