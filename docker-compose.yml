services:
  mysql:
    image: mysql:8.4
    container_name: database-bank-mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${ACCOUNT_DB_NAME}"
      MYSQL_USER: "${ACCOUNT_DB_USER}"
      MYSQL_PASSWORD: "${ACCOUNT_DB_PASSWORD}"
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:17
    container_name: database-bank-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: "${TRANSACTION_DB_NAME}"
      POSTGRES_USER: "${TRANSACTION_DB_USER}"
      POSTGRES_PASSWORD: "${TRANSACTION_DB_PASSWORD}"
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  account-service:
    container_name: ms-account
    build:
      context: ./account-service
    image: account-service:0.0.1
    restart: on-failure
    ports:
      - "${ACCOUNT_SERVICE_PORT}:8100"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M"

      SPRING_R2DBC_URL: "${ACCOUNT_R2DBC_URL}"
      SPRING_R2DBC_USERNAME: "${ACCOUNT_DB_USER}"
      SPRING_R2DBC_PASSWORD: "${ACCOUNT_DB_PASSWORD}"

      SPRING_FLYWAY_URL: "${ACCOUNT_FLYWAY_URL}"
      SPRING_FLYWAY_USERNAME: "${ACCOUNT_DB_USER}"
      SPRING_FLYWAY_PASSWORD: "${ACCOUNT_DB_PASSWORD}"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

  transaction-service:
    container_name: ms-transaction
    build:
      context: ./transaction-service
    image: transaction-service:0.0.1
    restart: on-failure
    ports:
      - "${TRANSACTION_SERVICE_PORT}:8101"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256M -Xmx256M"

      SPRING_R2DBC_URL: "${TRANSACTION_R2DBC_URL}"
      SPRING_R2DBC_USERNAME: "${TRANSACTION_DB_USER}"
      SPRING_R2DBC_PASSWORD: "${TRANSACTION_DB_PASSWORD}"

      SPRING_FLYWAY_URL: "${TRANSACTION_FLYWAY_URL}"
      SPRING_FLYWAY_USERNAME: "${TRANSACTION_DB_USER}"
      SPRING_FLYWAY_PASSWORD: "${TRANSACTION_DB_PASSWORD}"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      ACCOUNT_SERVICE_URL: "${ACCOUNT_SERVICE_BASE_URL}"

volumes:
  mysql_data:
  postgres_data: